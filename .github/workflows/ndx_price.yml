name: 纳指定投计算与微信推送

on:
  # GitHub Actions 使用 UTC；06:30 UTC = 北京时间 14:30。
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

jobs:
  run-ndx-price:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: 安装依赖
        run: python -m pip install --upgrade pip yfinance requests

      - name: 运行纳指定投计算
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: python ndx_price.py
         
